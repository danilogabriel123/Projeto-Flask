{% extends 'base.html' %} 
{% block content %} 
<div class="page-auth"> 
<div class="form-card"> 
<h2>Criar Conta</h2> 
<form action="{{ url_for('auth.cadastro') }}" method="POST"> 
<div class="form-group"> 
<label for="nome">Nome Completo</label> 
<input type="text" id="nome" name="nome" required placeholder="Ex: 
Marlon Silva"> 
</div> 
<div class="form-group"> 
<label for="email">E-mail</label> 
placeholder="seu@email.com"> 
</div> 
<div class="form-group"> 
placeholder="••••••••"> 
</div> 
</form> 
</div> 
<input type="email" id="email" name="email" required 
<label for="senha">Senha</label> 
<input type="password" id="senha" name="senha" required 
<button type="submit" class="btn">Cadastrar</button> 
<p class="auth-footer">Já possui conta? <a href="{{ url_for('auth.login') 
}}">Faça login</a></p> 
</div> 
{% endblock %}
